name: Clinflash
description: >-
  Clinflash (易迪希医药科技 / Clinflash Healthcare Technology) is a Chinese clinical-research
  technology company founded in 2014 that provides a cloud-based clinical trial information
  platform for pharmaceutical sponsors, CROs, and research sites. Its self-developed suite
  spans more than ten systems, including Clinflash EDC (electronic data capture), IRT/IWRS
  (randomization and trial supply management), eCOA/ePRO (electronic clinical outcome and
  patient-reported outcomes), Safety/PV (pharmacovigilance and drug-safety alerting), CTMS
  (clinical trial management), eTMF (electronic trial master file), eCTD, eConsent, eSign,
  Coder (medical coding), and ePAY (subject payment). Clinflash has supported thousands of
  clinical trial projects for over a thousand pharmaceutical, generic, medical-device, and
  IVD organizations, including pivotal Phase III and international multi-center studies. The
  platform is delivered as a login-gated SaaS at cloud.clinflash.com and, as of this profile,
  publishes no public developer/API program, OpenAPI, SDKs, or GitHub organization.
